name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (editable, stdlib only)
        run: pip install -e .
      - name: Unit tests
        run: python -m unittest discover tests -v

  webapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Front tests (harness maison, aucune dépendance npm)
        run: |
          node webapp/tests/list_ui.test.mjs
          node webapp/tests/volume_ui.test.mjs

  # Le FR est la source de vérité ; l'EN doit suivre. On refuse un changement
  # de README.md qui n'est pas accompagné d'un changement de README.en.md.
  # Marche aussi bien sur push direct (main) que sur PR.
  readme-sync:
    name: README FR/EN synchronisés
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0        # nécessaire pour diff before→sha
      - name: Vérifier que README.en.md suit README.md
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # push initial / force-push : `before` peut être tout-zéros → repli sur HEAD^
          if [ -z "$BASE" ] || echo "$BASE" | grep -q '^0\+$'; then
            BASE="$(git rev-parse HEAD^ 2>/dev/null || echo HEAD)"
          fi
          changed="$(git diff --name-only "$BASE" "$HEAD_SHA")"
          fr=$(echo "$changed" | grep -E '^README\.md$' || true)
          en=$(echo "$changed" | grep -E '^README\.en\.md$' || true)
          if [ -n "$fr" ] && [ -z "$en" ]; then
            echo "::error::README.md (FR) modifié sans README.en.md (EN) → pense à traduire." && exit 1
          fi
          echo "README.md : ${fr:+modifié}${fr:-intact} | README.en.md : ${en:+modifié}${en:-intact}"
