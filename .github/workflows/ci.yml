name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (editable, stdlib only)
        run: pip install -e .
      - name: Unit tests
        run: python -m unittest discover tests -v

  webapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Front tests (harness maison, aucune dépendance npm)
        run: |
          node webapp/tests/list_ui.test.mjs
          node webapp/tests/volume_ui.test.mjs
