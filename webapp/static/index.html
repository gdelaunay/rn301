<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Yamaha R-N301</title>
<script>
/* Thème appliqué avant le rendu (évite le flash de fond). Mécanisme repris du pack. */
(function(){try{var m=localStorage.getItem('theme');if(m==='light'||m==='dark')document.documentElement.setAttribute('data-theme',m);}catch(e){}})();
</script>
<style>
/* =====================================================================
   R-N301 webapp — socle minimaliste.
   Palette + dual-layer papier repris du pack basedesign (couleurs seules).
   Fonts : stack système uniquement (rien d' éditorial). Radius 2px,
   hairline 1px, zéro ombre, zéro halo. Icônes Material : plus tard.
   ===================================================================== */

/* -- Tokens ------------------------------------------------------------ */
:root{
  /* Palette Campbell (référence) */
  --campbell-black:#0C0C0C; --campbell-red:#C50F1F; --campbell-green:#13A10E;
  --campbell-yellow:#C19C00; --campbell-blue:#0037DA; --campbell-magenta:#881798;
  --campbell-cyan:#3A96DD; --campbell-white:#CCCCCC; --campbell-bright-black:#767676;
  --campbell-bright-red:#E74856; --campbell-bright-green:#16C60C;
  --campbell-bright-blue:#3B78FF; --campbell-bright-magenta:#B4009E;
  --campbell-bright-cyan:#61D6D6; --campbell-bright-white:#F2F2F2;

  /* Papier — dual-layer (clair par défaut) */
  --bg-deep:#F3F1EC; --bg-surface:#F8F6F1; --bg-elevated:#FFFFFF;
  --ink:#0C0C0C; --ink-muted:#4D4D4D; --ink-subtle:#666666;
  --border:var(--campbell-white); --border-strong:var(--campbell-bright-black);
  --link:var(--campbell-blue); --error:var(--campbell-red); --success:var(--campbell-green);
  --info:var(--campbell-cyan);
  /* Primaire tournante — 8 tokens bruts (light/dark), calculés À LA MAIN.
     Pas de color-mix() : comme le pack, on privilégie la compat navigateur.
     Dérivées : shade = primaire 88% + ink 12% ; focus = primaire 40% + fond élevé 60%.
     La teinte (ici magenta Campbell) est un placeholder — on la choisira ensuite. */
  --primary-light:       #035CB5;  /* teinte retenue (bleu) */
  --primary-dark:        #035CB5;  /* même teinte en sombre ; seules les dérivées changent */
  --on-primary-light:    #FFFFFF;
  --on-primary-dark:     #FFFFFF;
  --primary-shade-light: #0452A1;  /* hover (light) = #035CB5 88% + ink 12% */
  --primary-shade-dark:  #206EBC;  /* hover (dark)  = #035CB5 88% + ink-dark 12% */
  --focus-ring-light:    #9ABEE1;  /* focus (light) = #035CB5 40% + bg-elev 60% */
  --focus-ring-dark:     #173A5C;  /* focus (dark)  = #035CB5 40% + bg-elev-dark 60% */
  /* L'aiguillage vers --primary/--on-primary/--primary-shade/--focus-ring est
     fait par la couche de résolution plus bas (comme le pack). */
  --on:var(--campbell-green); --active-bg:#F4F0E6; --track:var(--campbell-bright-white);

  /* Fonts système basiques */
  --font-sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Liberation Mono",monospace;

  /* Géométrie */
  --radius:2px; --control-h:36px; --hairline:1px; --speed:90ms;
}
:root[data-theme="dark"]{
  --bg-deep:#161513; --bg-surface:#1E1D1B; --bg-elevated:#252320;
  --ink:var(--campbell-bright-white); --ink-muted:#A0A0A0; --ink-subtle:#8A8A88;
  --border:#3A3A38; --border-strong:#5A5A58;
  --link:var(--campbell-bright-blue); --error:var(--campbell-bright-red);
  --success:var(--campbell-bright-green); --info:var(--campbell-bright-cyan);
  --on:var(--campbell-bright-green); --active-bg:#302D1D; --track:#2A2A28;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg-deep:#161513; --bg-surface:#1E1D1B; --bg-elevated:#252320;
    --ink:var(--campbell-bright-white); --ink-muted:#A0A0A0; --ink-subtle:#8A8A88;
    --border:#3A3A38; --border-strong:#5A5A58;
    --link:var(--campbell-bright-blue); --error:var(--campbell-bright-red);
    --success:var(--campbell-bright-green); --info:var(--campbell-bright-cyan);
    --on:var(--campbell-bright-green); --active-bg:#302D1D; --track:#2A2A28;
  }
}

/* Résolution de la primaire — l'aiguillage light↔dark (comme le pack).
   Les tokens résolus sont ceux consommés par le CSS ; ils pointent sur la
   variante light (défaut) ou dark selon l'attribut data-theme / le système. */
:root{--primary:var(--primary-light);--on-primary:var(--on-primary-light);--primary-shade:var(--primary-shade-light);--focus-ring:var(--focus-ring-light)}
:root[data-theme="dark"]{--primary:var(--primary-dark);--on-primary:var(--on-primary-dark);--primary-shade:var(--primary-shade-dark);--focus-ring:var(--focus-ring-dark)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--primary:var(--primary-dark);--on-primary:var(--on-primary-dark);--primary-shade:var(--primary-shade-dark);--focus-ring:var(--focus-ring-dark)}
}

/* -- Base -------------------------------------------------------------- */
*,*::before,*::after{box-sizing:border-box}
/* Bascule de thème = instantanée et uniforme (tous les éléments d'un coup).
   On coupe les transitions pendant 1 frame pour éviter le mismatch
   boutons-glissent / fond-snappe. Le hover des contrôles reste animé. */
html.theming *,html.theming *::before,html.theming *::after{transition:none!important}
body{margin:0;background:var(--bg-deep);color:var(--ink);
  font:400 14px/1.6 var(--font-sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 16px 16px}
h1{font-size:1.15rem;font-weight:600;letter-spacing:-.01em;margin:0;color:var(--ink)}
.eyebrow{font:500 10px/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-subtle)}
a{color:var(--link)}

/* header */
.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding:14px 0;border-bottom:var(--hairline) solid var(--border)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
#sysinfo{font:400 11px/1.3 var(--font-mono);color:var(--ink-subtle);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* card */
.card{background:var(--bg-surface);border:var(--hairline) solid var(--border);
  border-radius:var(--radius);padding:16px;margin-top:14px}
.card>.lbl{margin-bottom:10px}

/* row */
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row+.row, .now+.row, .list+.row, .row+.list, .now{margin-top:8px}
.spacer{flex:1}

/* controls */
button,select,input{font:inherit;color:var(--ink)}
button,select,input:not([type=range]):not([type=file]){height:var(--control-h);
  padding:0 12px;border:var(--hairline) solid var(--border);border-radius:var(--radius);
  background:var(--bg-elevated);cursor:pointer;
  transition:background-color var(--speed) ease-out,border-color var(--speed) ease-out,color var(--speed) ease-out}
button{background:var(--bg-surface)}
button:hover:not(:disabled){background:var(--bg-elevated);border-color:var(--border-strong)}
button:active:not(:disabled){background:var(--active-bg)}
button.on,button.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
button.on:hover:not(:disabled),button.primary:hover:not(:disabled){background:var(--primary-shade);border-color:var(--primary-shade)}
button.on{font-weight:600}
button:disabled{opacity:.38;cursor:not-allowed}
input,select{cursor:text}
select{cursor:pointer}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
input:focus,select:focus{border-color:var(--border-strong);outline:2px solid var(--focus-ring);outline-offset:1px}
::placeholder{color:var(--ink-subtle)}

/* volume — piste remplie à la primaire ; --fill piloté en JS pour l'instantanéité */
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:var(--control-h);
  background:transparent;border:0;padding:0;cursor:pointer;min-width:120px}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;
  background:linear-gradient(to right,var(--primary) var(--fill,0%),var(--border-strong) var(--fill,0%))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--border-strong)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--primary)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;
  border-radius:50%;background:var(--primary);border:2px solid var(--bg-surface)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:2px solid var(--bg-surface);
  border-radius:50%;background:var(--primary)}
/* .volval : lecture seule — style « puits » (voir plus bas, bloc redesign) */

/* sources : voir le bloc redesign plus bas (hauteur auto obligatoire, sinon le
   libellé sous l'icône est rogné par height:var(--control-h) + overflow:hidden) */

/* chips / badges */
.chip{display:inline-block;padding:1px 7px;border:var(--hairline) solid currentColor;
  border-radius:var(--radius);font:500 10px/1.4 var(--font-mono);letter-spacing:.06em;color:var(--ink-subtle)}
.chip.on{color:var(--success);border-color:var(--success)}

/* now playing */
.now{display:flex;gap:12px;align-items:center}
.now img{width:56px;height:56px;border-radius:var(--radius);background:#000;object-fit:cover;border:var(--hairline) solid var(--border)}
/* Placeholder : carré aux mêmes dimensions que la pochette, note de musique en
   --ink-muted. Affiché tant qu'aucune image n'a chargé (ou si elle est en erreur). */
.artph{flex:0 0 auto;width:56px;height:56px;display:flex;align-items:center;justify-content:center;
  border-radius:var(--radius);border:var(--hairline) solid var(--border);
  background:var(--bg-deep);color:var(--ink-muted);font-size:26px}
.now .t{font-weight:600;line-height:1.3}
.now .s{color:var(--ink-muted);font-size:.85rem}

/* list (navigateur) */
.list{font-size:.9rem}
.list .li{padding:7px 10px;border-radius:var(--radius);display:flex;gap:8px;cursor:pointer;border-bottom:var(--hairline) solid var(--border)}
.list .li:last-child{border-bottom:0}
.list .li:hover{background:var(--bg-elevated)}
.list .li.sel{background:var(--active-bg);color:var(--ink);font-weight:600}
.list .li.un{color:var(--ink-subtle);cursor:default}
.list .li.un:hover{background:none}
/* Marqueur « en lecture » — À NE PAS CONFONDRE avec .sel (le curseur de
   NAVIGATION de l'ampli, Cursor_Position/Current_Line, qui ne bouge PAS quand
   la piste change : fin de morceau ou Skip Fwd le laissent où l'utilisateur a
   cliqué). La ligne qui joue est retrouvée côté client (Play_Info.Meta_Info ↔
   texte des lignes) et signalée par la couleur primaire + une icône à droite.
   Icône posée en ::after : le texte de la ligne reste le titre seul. */
.list .li.cur{color:var(--primary)}
.list .li.cur::after{content:'graphic_eq';margin:auto 0 auto auto;flex:0 0 auto;
  font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;
  font-size:18px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;
  -webkit-font-feature-settings:'liga';font-feature-settings:'liga';color:var(--primary);user-select:none}
.list .li.cur.npidle::after{content:'play_arrow';font-family:'Material Symbols Filled';opacity:.7}   // pausé/stoppé : métadonnées connues, rien ne tourne
/* Navigateur en chargement : la carte RESTE affichée avec son contenu précédent.
   La masquer (Menu_Status='Busy' le temps que l'ampli charge) supprimait ~300 px
   de hauteur → la page remontait à chaque clic, puis redescendait. Contenu grisé
   + non cliquable, spinner dans l'en-tête. */
#listcard.busy .list,#listcard.busy .row button{opacity:.45;pointer-events:none}
.spin{display:none;width:13px;height:13px;margin-left:7px;vertical-align:-2px;
  border:2px solid var(--border-strong);border-top-color:var(--primary);
  border-radius:50%;animation:spin .7s linear infinite}
#listcard.busy .spin{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}}

/* inputs divers */
input[type=number],input[type=url],input[type=file]{height:auto;padding:8px 10px;width:auto}
input[type=url]{flex:1;min-width:0}
input[type=file]{padding:6px;background:var(--bg-elevated);font-size:.85rem}

/* toast */
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
  background:var(--error);color:#fff;padding:8px 14px;border-radius:var(--radius);
  font:500 12px/1 var(--font-mono);opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}

/* details systeme */
details summary{cursor:pointer;color:var(--ink-subtle);font:500 11px/1 var(--font-mono);letter-spacing:.1em;text-transform:uppercase}
details[open] summary{margin-bottom:12px}

/* theme toggle : 3 etats, icon seule */
.theme-toggle{width:var(--control-h);padding:0;display:inline-grid;align-items:center;justify-items:center}
.theme-toggle svg{width:16px;height:16px;display:none;fill:none;stroke:currentColor;stroke-width:1.4}
.theme-toggle[data-mode=auto] .i-auto,
.theme-toggle[data-mode=light] .i-light,
.theme-toggle[data-mode=dark] .i-dark{display:block}

/* ===== Icônes Material Symbols Outlined — self-hosted (poids 400, grille opsz24),
   licence Apache 2.0 (voir assets/LICENSE-material-symbols.txt). Une icône = une
   LIGATURE : le texte de l'élément est le NOM de l'icône. Net à toute taille (vectoriel). */
@font-face{font-family:'Material Symbols Outlined';font-style:normal;font-weight:400;
  src:url('assets/material-symbols-outlined.woff2') format('woff2');font-display:swap}
/* Variante pleine (FILL=1, statique) : mêmes ligatures, mêmes métriques.
   Utilisée là où une icône pleine se lit mieux : transport (play/pause, prev,
   next, stop) et mute. */
@font-face{font-family:'Material Symbols Filled';font-style:normal;font-weight:400;
  src:url('assets/material-symbols-filled.woff2') format('woff2');font-display:swap}
.msi{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;line-height:1;
  letter-spacing:normal;text-transform:none;white-space:nowrap;display:inline-block;
  vertical-align:middle;font-size:20px;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';user-select:none}
button{display:inline-flex;align-items:center;justify-content:center}
button .msi{font-size:22px}
button.pwr .msi,#btnPlay .msi{font-size:26px}
/* sources : icône au-dessus, libellé dessous (pile/tag).
   height:auto est INDISPENSABLE : la règle globale des boutons impose
   height:var(--control-h) (36px) et .src a overflow:hidden → sans ça, l'icône
   (24px) + gap + texte ne rentrent pas et le libellé est rogné (invisible). */
.src{flex:1 1 30%;height:auto;min-width:0;display:flex;flex-direction:column;
  align-items:center;gap:6px;padding:9px 6px;overflow:hidden;text-align:center}
.src .msi{font-size:24px;margin:0;line-height:1}
.msi.rot{transform:rotate(-90deg)}
.msi.fill{font-family:'Material Symbols Filled'}
.src .lb{display:block;width:100%;font-size:.72rem;line-height:1.25;letter-spacing:.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* lecture du volume : champ en lecture seule, centré sur la ligne Power/Mute.
   Volontairement PAS un bouton : fond renfoncé (--bg-deep), ombre interne,
   encre atténuée, curseur par défaut, aucun état hover/active/focus. */
.volval{display:inline-flex;align-items:center;justify-content:center;
  height:var(--control-h);min-width:64px;padding:0 10px;
  border:var(--hairline) solid var(--border);border-radius:var(--radius);
  background:var(--bg-deep);box-shadow:inset 0 1px 2px rgb(0 0 0 / .10);
  font:600 1.05rem/1 var(--font-mono);font-variant-numeric:tabular-nums;
  letter-spacing:.01em;color:var(--ink-muted);cursor:default;user-select:none}
/* boutons à icône seule : plus d'air + cible carrée ; Power/Play un peu plus grands */
button:has(> .msi):not(.src){min-width:var(--control-h);padding-inline:14px}
button.pwr,#btnPlay,#btnMute{height:40px;min-width:46px}
#btnPower { padding-inline: 12px;}

@media (max-width:560px){.src{flex-basis:44%}}
</style>
</head>
<body>
<div class="wrap">

  <div class="bar">
    <div class="brand">
      <h1>Yamaha R-N301</h1>
      <span id="sysinfo">connexion…</span>
    </div>
    <button class="theme-toggle" data-theme-toggle data-mode="auto" aria-label="Thème : auto" title="Thème : auto / clair / sombre">
      <svg class="i-auto" viewBox="0 0 24 24"><path d="M12 4a8 8 0 100 16z" fill="currentColor" stroke="none" opacity=".35"/><circle cx="12" cy="12" r="8"/></svg>
      <svg class="i-light" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      <svg class="i-dark" viewBox="0 0 24 24"><path d="M20 14a8 8 0 11-9.5-10 7 7 0 109.5 10z"/></svg>
    </button>
  </div>

  <div class="card">
    <div class="row">
      <button class="pwr" id="btnPower" onclick="api('power',{},true)" aria-label="Power" title="Power"><i class="msi">power_settings_new</i></button>
      <div class="spacer"></div>
      <span class="volval" id="volval" title="Volume" aria-hidden="true">--</span>
      <div class="spacer"></div>
      <button id="btnMute" onclick="api('mute',{},true)" aria-label="Mute" title="Mute"><i class="msi fill">volume_off</i></button>
    </div>
    <div class="row">
      <button aria-label="Volume moins" title="Volume moins" oncontextmenu="return false" onpointerdown="holdStart(-1)" onpointerup="holdEnd()" onpointerleave="holdEnd()" onpointercancel="holdEnd()" onclick="if(event.detail===0)tapVol(-1)"><i class="msi">remove</i></button>
      <input type="range" id="vol" min="0" max="100" step="1" oninput="volInput(+this.value)" onchange="volEnd()" aria-label="Volume" title="Volume">
      <button aria-label="Volume plus" title="Volume plus" oncontextmenu="return false" onpointerdown="holdStart(1)" onpointerup="holdEnd()" onpointerleave="holdEnd()" onpointercancel="holdEnd()" onclick="if(event.detail===0)tapVol(1)"><i class="msi">add</i></button>
    </div>
  </div>

  <div class="card">
    <div class="lbl eyebrow">Source</div>
    <div class="row" id="sources"></div>
  </div>

  <div class="card" id="nowcard" style="display:none">
    <div class="row" style="justify-content:space-between">
      <span class="eyebrow">Lecture</span>
      <span class="chip" id="playstate"></span>
    </div>
    <div class="now">
      <img id="art" style="display:none" alt="">
      <i class="msi artph" id="artph" aria-hidden="true">library_music</i>
      <div>
        <div class="t" id="npTitle"></div>
        <div class="s" id="npSub"></div>
      </div>
    </div>
    <div class="row">
      <button id="btnPrev" aria-label="Précédent" title="Précédent" onclick="api('playback',{action:'Skip Rev'})"><i class="msi fill">skip_previous</i></button>
      <button class="primary" id="btnPlay" aria-label="Lecture / Pause" title="Lecture / Pause" onclick="playBtn()"><i class="msi fill" id="playIcon">play_arrow</i></button>
      <button id="btnNext" aria-label="Suivant" title="Suivant" onclick="api('playback',{action:'Skip Fwd'})"><i class="msi fill">skip_next</i></button>
      <button aria-label="Stop" title="Stop" onclick="pushMode?api('pushctl',{action:'Stop'}):api('playback',{action:'Stop'})"><i class="msi fill">stop</i></button>
      <div class="spacer"></div>
      <button id="btnShuffle" aria-label="Aléatoire" title="Aléatoire" onclick="api('playmode',{what:'shuffle',value:shuffleNext()})"><i class="msi">shuffle</i></button>
      <button id="btnRepeat" aria-label="Répéter" title="Répéter" onclick="api('playmode',{what:'repeat',value:repeatNext()})"><i class="msi" id="repeatIcon">repeat</i></button>
    </div>
  </div>

  <div class="card" id="tunercard" style="display:none">
    <div class="row" style="justify-content:space-between">
      <span class="eyebrow">Tuner</span>
      <span class="chip" id="tunerinfo"></span>
    </div>
    <div class="row">
      <button aria-label="Descendre" title="Descendre" onclick="api('tuner',{op:'step',band:band,dir:'Down'})"><i class="msi">caret_left</i></button>
      <select id="bandsel" onchange="band=this.value;refresh()"><option>FM</option><option>AM</option></select>
      <button aria-label="Monter" title="Monter" onclick="api('tuner',{op:'step',band:band,dir:'Up'})"><i class="msi">caret_right</i></button>
      <button aria-label="Recherche auto" title="Recherche auto" onclick="api('tuner',{op:'search',band:band,dir:'Up'})"><i class="msi">search</i></button>
      <input type="number" id="freq" step="0.1" style="width:88px" aria-label="Fréquence" title="Fréquence">
      <button aria-label="Accorder" title="Accorder" onclick="api('tuner',{op:'tune',band:band,freq:document.getElementById('freq').value})"><i class="msi">tune</i></button>
    </div>
    <div class="row" id="presets"></div>
  </div>

  <div class="card" id="listcard" style="display:none">
    <div class="row" style="justify-content:space-between">
      <span class="eyebrow">Navigateur<i class="spin" aria-hidden="true"></i></span>
      <span class="chip" id="menuname"></span>
    </div>
    <div class="list" id="menu"></div>
    <div class="row">
      <button aria-label="Retour" title="Retour" onclick="nav('cursor',{dir:'Return'})"><i class="msi">arrow_back</i></button>
      <button aria-label="Monter" title="Monter" onclick="nav('cursor',{dir:'Up'})"><i class="msi">arrow_upward</i></button>
      <button aria-label="Descendre" title="Descendre" onclick="nav('cursor',{dir:'Down'})"><i class="msi">arrow_downward</i></button>
      <button aria-label="Sélectionner" title="Sélectionner" onclick="nav('cursor',{dir:'Sel'})"><i class="msi">check</i></button>
    </div>
  </div>

  <div class="card" id="pushcard" style="display:none">
    <div class="row" style="justify-content:space-between">
      <span class="eyebrow">Mode Push — audio du navigateur</span>
      <span class="chip" id="pushstate"></span>
    </div>
    <div class="row">
      <input type="file" id="pushfile" accept="audio/*" style="flex:1;min-width:0">
      <button aria-label="Envoyer le fichier" title="Envoyer le fichier" onclick="pushFile()"><i class="msi">cloud_upload</i></button>
    </div>
    <div class="row">
      <input type="url" id="pushurl" placeholder="http://… (webradio MP3, NAS…)">
      <button aria-label="Lire l'URL" title="Lire l'URL" onclick="api('push',{url:document.getElementById('pushurl').value})"><i class="msi fill">play_arrow</i></button>
    </div>
  </div>

  <div class="card">
    <details>
      <summary>Système</summary>
      <div class="row">
        <button id="btnNetStdby" onclick="api('netstandby',{},true)">Network Standby</button>
        <span class="chip" id="netname"></span>
      </div>
      <div class="row">
        <span class="eyebrow">IR</span>
        <button onclick="api('remote',{key:'net_cycle'})">Cycle réseau</button>
        <button onclick="api('remote',{key:'shuffle'})">Shuffle</button>
        <button onclick="api('remote',{key:'repeat'})">Repeat</button>
      </div>
      <p style="margin:8px 0 0;color:var(--ink-subtle);font-size:.8rem">Sleep / Gapless / Device_Name : non supportés par ce firmware en YNC.</p>
    </details>
  </div>

</div>

<div id="toast"></div>

<script>
let state={}, band='FM', shuffle=false, repeat='Off', playing=false, pushMode=false;
let listEver=false, listBusySince=0, listRetry=null, listGaveUp=false;   // navigateur
/* Mapping source (Input_Sel / liste des entrées) -> nom d'icône Material Symbols.
   Clés en MAJUSCULES ; srcIcon normalise. Repli 'input' si source inconnue. */
const SRC_ICON={'SPOTIFY':'contactless','NET RADIO':'podcasts','SERVER':'dns','AIRPLAY':'airplay','TUNER':'radio','CD':'album','OPTICAL':'flare','COAXIAL':'adjust','LINE1':'cable','LINE2':'cable','LINE3':'cable','PUSH':'cloud_upload'};
function srcIcon(v){return SRC_ICON[((v||'').trim().toUpperCase())]||'input';}
/* Sources dont l'icône doit être tournée de -90° (graphic_eq = barres verticales
   → tournées à l'horizontale pour évoquer le logo Spotify). */
const SRC_ICON_ROT=new Set(['SPOTIFY']);
function srcIconCls(v){return SRC_ICON_ROT.has((v||'').trim().toUpperCase())?' rot':'';}
/* Ordre d'affichage des sources : celui de l'app Yamaha native (lue de droite à
   gauche, de haut en bas). L'ampli les renvoie dans son propre ordre (Spotify,
   NET RADIO, SERVER, AirPlay, TUNER, CD, …) → on réindexe côté UI, sans toucher
   au serveur. Une source inconnue passe après les connues, tri stable. PUSH
   (pseudo-source locale) reste toujours dernier. */
const SRC_ORDER=['TUNER','CD','OPTICAL','COAXIAL','LINE1','LINE2','LINE3','SPOTIFY','SERVER','NET RADIO','AIRPLAY'];
function srcRank(v){const i=SRC_ORDER.indexOf((v||'').trim().toUpperCase());return i<0?SRC_ORDER.length:i;}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
/* Pochette d'album. src n'est réassigné QUE si l'URL a changé : render() tourne à
   chaque polling (~2,5 s) et une image en erreur n'est pas mise en cache par le
   navigateur → réassigner la même URL morte refaisait un GET à chaque tour
   (l'icône « flashait » en image cassée). L'URL en échec est mémorisée dans
   dataset.url : on la masque et on n'y revient plus tant qu'elle ne change pas. */
function setArt(img,url){
  const ph=document.getElementById('artph');
  const show=on=>{img.style.display=on?'':'none';if(ph)ph.style.display=on?'none':'';};
  if(!url){img.dataset.url='';show(false);return;}
  if(img.dataset.url===url)return;
  img.dataset.url=url;
  img.onload=()=>show(true);
  img.onerror=()=>show(false);
  img.src=url;
}

function enterPush(){pushMode=true;api('input',{val:'SERVER'});}
function exitPush(v){pushMode=false;api('input',{val:v});}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
async function api(action,body,norefresh){
  try{
    const r=await fetch('/api/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
    const j=await r.json();
    if(!r.ok||j.error) throw new Error(j.error||r.status);
    if(j.state) render(j.state);
    if(!norefresh) refresh();          // seulement sur succès : un échec ne repeint pas
    /* Transport : le full_state que le POST renvoie porte souvent les
       métadonnées de l'ANCIENNE piste (l'ampli met ~1 s à charger la suivante).
       Deux sondages légers rattrapent la carte Lecture et le marqueur du
       navigateur. Voir bumpNow()/pollNow() plus bas. */
    if(action==='playback'||action==='pushctl'||action==='line')bumpNow();
    return j;
  }catch(e){toast('Erreur : '+e.message);return null;}
}
/* ===== Volume : une seule autorité d'affichage à la fois =====
   Deux vérités, jamais mélangées :
     - localVol : ce que l'utilisateur vise → affiché tant qu'il a la main ;
     - devVol   : la dernière valeur DEVICE fraîche → affichée le reste du temps.
   Toute valeur device (SSE, poll, ack du POST) entre par noteDevice() avec un
   horodatage ; un échantillon plus VIEUX que le précédent est jeté, jamais
   peint. Les acks sont filtrés par numéro de commande (seul celui de la
   DERNIÈRE commande envoyée compte) et les échos device sont filtrés par
   ownEcho() : une valeur qu'on vient soi-même d'envoyer et qui n'est PAS la
   dernière cible est un écho périmé de nos propres commandes → poubelle. C'est
   ce double filtre qui tue le flapping 30→15→30 sur un glisser alterné.
   La main revient au device IDLE_MS après le dernier évènement local : on peint
   alors devVol une fois, à condition d'avoir un échantillon POSTÉRIEUR au
   dernier envoi. Un clamp firmware (100 visé, max réel 80) se cale donc net,
   sans aller-retour, et la plage du slider RESTE 0..100 fixe.
   Envois bornés (throttle 120 ms, leading + trailing) + envoi final au relâchement. */
const IDLE_MS=400, THROTTLE_MS=120, ECHO_MS=2000;
let localVol=0, devVol=null, devTs=0, devVolTs=0, gestureUntil=0;
let releaseTimer=null, throttleTimer=null, pendingTarget=null, lastSentMs=0, sentSeq=0;
let lastSentVol=null, sentHist=[];
let holdDelay=null, holdRep=null;
const $=id=>document.getElementById(id);
function clampVol(v){return Math.max(0,Math.min(100,Math.round(v)));}
let paintedVol=null;
function paintVol(v){const el=$('vol');
  if(v!==paintedVol){paintedVol=v;el.value=v;el.style.setProperty('--fill',v+'%');}  // pas de repaint redondant
  paintVolLabel();}
/* Le libellé dépend de state.power (— en veille) ET de la valeur courante : il
   est rafraîchi à part, car un échantillon volume peut être rejeté (périmé)
   alors que l'état power, lui, vient d'arriver. Sans ça, un écho SSE reçu avant
   le 1er render() laissait « -- » collé jusqu'au poll suivant. */
function paintVolLabel(){
  const v=owning()?localVol:devVol;
  $('volval').textContent=(state.power==='On'&&v!=null)?v:'--';
}
function paintMute(m){$('btnMute').classList.toggle('on',m==='On');}
function owning(){return Date.now()<gestureUntil;}
function shownVol(){return (owning()||devVol==null)?localVol:devVol;}

/* Nos propres commandes laissent des échos (GENA/poll) qui peuvent arriver EN
   RETARD, après l'ack de la commande suivante. Une valeur qu'on vient d'envoyer
   et qui n'est pas la dernière cible est donc un écho périmé, pas une vérité. */
function ownEcho(v){
  if(v===lastSentVol)return false;
  const now=Date.now();
  for(let i=sentHist.length-1;i>=0;i--){
    const s=sentHist[i];
    if(now-s.at>ECHO_MS)break;
    if(s.val===v)return true;
  }
  return false;
}

/* Entrée UNIQUE de la vérité device. ts = instant où la valeur a été observée
   côté ampli. Pour le poll : l'heure d'ENVOI de la requête, pas celle de la
   réponse — un snapshot en route ne doit pas écraser un SSE plus neuf. */
function noteDevice(vol,mute,ts,trusted){
  ts=(ts==null)?Date.now():ts;
  if(ts<devTs)return;                                  // échantillon périmé → poubelle
  devTs=ts;
  if(vol!=null&&!isNaN(vol)){
    const cv=clampVol(vol);
    /* trusted = ack du POST (relu côté serveur APRÈS le set) : ce n'est jamais un
       écho périmé, donc on contourne ownEcho. Mais si on a observé PLUS RÉCENT
       depuis notre envoi (changement externe pendant l'ordre), l'observation prime. */
    const keep=trusted?(devVolTs<=lastSentMs||cv===devVol):!ownEcho(cv);
    if(keep){
      devVol=cv; devVolTs=ts; state.volume=cv;
      if(!owning())paintVol(cv);                       // sinon : l'utilisateur a la main
    }
  }
  if(mute!=null){state.mute=mute;paintMute(mute);}
}

/* Côté utilisateur : feedback instantané, puis envoi throttle. */
function localSet(v){
  localVol=clampVol(v);
  gestureUntil=Date.now()+IDLE_MS;                     // ré-armé par chaque évènement local
  paintVol(localVol);
  pendingTarget=localVol;
  const since=Date.now()-lastSentMs;
  if(since>=THROTTLE_MS)flushVol();
  else if(!throttleTimer)throttleTimer=setTimeout(flushVol,THROTTLE_MS-since);
  clearTimeout(releaseTimer);releaseTimer=setTimeout(release,IDLE_MS+THROTTLE_MS);
}
function flushVol(){
  throttleTimer=null;
  if(pendingTarget===null)return;
  const v=pendingTarget;pendingTarget=null;
  lastSentMs=Date.now();const n=++sentSeq;
  lastSentVol=v;sentHist.push({val:v,at:lastSentMs});
  if(sentHist.length>24)sentHist.shift();
  api('volume',{val:v},true).then(function(j){         // norefresh : l'ack porte déjà volume/mute
    if(j&&n===sentSeq)noteDevice(j.volume,j.mute,null,true);   // ack DERNIÈRE commande, relu après le set
  });
}
/* Rendu de la main. Si un échantillon postérieur au dernier envoi est déjà là
   (ack ou écho GENA), on se cale dessus tout de suite ; sinon le prochain
   échantillon frais peindra de lui-même (on n'est plus owning). Dans les deux
   cas : UNE seule peinture, pas d'aller-retour. */
function release(){
  releaseTimer=null;
  if(owning()){releaseTimer=setTimeout(release,gestureUntil-Date.now()+10);return;}
  if(pendingTarget!==null){flushVol();return;}         // ne pas perdre la dernière cible
  if(devVol!=null&&devVolTs>=lastSentMs)paintVol(devVol);   // clamp éventuel → net
}
function endGesture(){
  clearTimeout(holdDelay);clearInterval(holdRep);holdDelay=holdRep=null;
  gestureUntil=Math.min(gestureUntil,Date.now()+THROTTLE_MS);   // laisse partir le trailing send
  clearTimeout(releaseTimer);releaseTimer=setTimeout(release,THROTTLE_MS+20);
}
function volInput(v){localSet(v);}
function volEnd(){endGesture();}
function holdBump(dir){localSet(shownVol()+dir);}
function holdStart(dir){clearTimeout(holdDelay);clearInterval(holdRep);holdBump(dir);
  holdDelay=setTimeout(function(){holdRep=setInterval(function(){holdBump(dir);},70);},300);}
function holdEnd(){endGesture();}
function tapVol(dir){localSet(shownVol()+dir);endGesture();}
function togglePlay(){return playing?'Pause':'Play';}
function playBtn(){pushMode?api('pushctl',{action:playing?'Pause':'Play'}):api('playback',{action:togglePlay()});}
function shuffleNext(){shuffle=!shuffle;return shuffle?'On':'Off';}
function repeatNext(){repeat=repeat==='Off'?'All':repeat==='All'?'One':'Off';return repeat;}

async function pushFile(){
  const inp=document.getElementById('pushfile');
  const f=inp.files&&inp.files[0];
  if(!f){toast('Choisis un fichier audio');return;}
  toast('Envoi…');
  try{
    const r=await fetch('/api/upload?name='+encodeURIComponent(f.name),{method:'POST',body:f});
    const j=await r.json();
    if(!r.ok||j.error)throw new Error(j.error||r.status);
    await api('push',{file:j.path});   // titre/artiste/album lus depuis les tags
    inp.value='';
  }catch(e){toast('Erreur : '+e.message);}
}

/* Amorçage : /api/basic = 1 à 2 GET YNC (basic_status + sources cachées) au
   lieu des 6-8 GET séquentiels de /api/state. Lancé EN PARALLÈLE du premier
   refresh() (la lib sérialise les accès via amp_lock) → power, volume, mute et
   sources sont à l'écran en ~200 ms au lieu de 2-3 s. Les cartes riches (now
   playing, tuner, liste, push) restent masquées jusqu'à l'état complet : elles
   dépendent de play_info/list_info que basic_status ne renvoie pas. */
async function bootstrap(){
  const sent=Date.now();
  try{
    const r=await fetch('/api/basic'); const j=await r.json();
    if(j.state) render(j.state,sent);
  }catch(_){/* le refresh() complet arrive derrière */}
}

async function refresh(){
  const sent=Date.now();          // fraîcheur conservative : ce snapshot date d'ICI
  try{
    const r=await fetch('/api/state'); const j=await r.json();
    if(j.state) render(j.state,sent);
  }catch(e){document.getElementById('sysinfo').textContent='ampli injoignable';}
}

/* Boutons de source (+ pseudo-source PUSH en dernier). Extrait de render() pour
   que bootstrap() puisse les construire depuis un état partiel (basic_status
   renvoie déjà Input_Sel, et /api/basic ajoute la liste des sources). */
function renderSources(s){
  const sc=document.getElementById('sources');
  if(!sc.children.length && s.inputs){
    [...s.inputs].sort((a,b)=>srcRank(a.value)-srcRank(b.value)).forEach(i=>{
      const b=document.createElement('button'); b.className='src'; b.dataset.val=i.value;
      b.innerHTML='<i class="msi'+srcIconCls(i.value)+'">'+srcIcon(i.value)+'</i><span class="lb">'+esc(i.value)+'</span>'; b.title=i.value;
      b.onclick=()=>{pushMode=false;api('input',{val:i.value});}; sc.appendChild(b);
    });
    const bp=document.createElement('button'); bp.className='src'; bp.id='srcPush';
    bp.innerHTML='<i class="msi">cloud_upload</i><span class="lb">PUSH</span>'; bp.title='PUSH — mode appareil (fichier ou URL)';
    bp.onclick=()=>enterPush(); sc.appendChild(bp);
  }
  [...sc.children].forEach(b=>{
    if(b.id==='srcPush') b.classList.toggle('on',pushMode);
    else b.classList.toggle('on',!pushMode&&b.dataset.val===s.input);
  });
}

/* --- Navigateur (SERVER / NET RADIO) -------------------------------------
   Règle : la carte ne disparaît JAMAIS entre deux niveaux de menu. Tant que
   l'ampli charge (Menu_Status='Busy', ou list_info null), on garde le contenu
   précédent, grisé + spinner, et on ré-interroge légèrement (POST /api/list =
   1 seul GET YNC, pas un full_state) jusqu'à ce que le menu soit Ready.
   D'où : pas de trou dans la hauteur de la page, donc pas de saut de scroll. */
const LIST_BUSY_MAX=8000;      // au-delà : le menu ne reviendra pas, on lâche
function setListBusy(on){
  const lc=document.getElementById('listcard');
  if(on){ if(!listBusySince)listBusySince=Date.now(); }
  else { listBusySince=0; clearTimeout(listRetry); listRetry=null; }
  const stuck=on&&Date.now()-listBusySince>LIST_BUSY_MAX;
  if(stuck)listGaveUp=true;                 // sinon le render d'après relance un cycle de 8 s
  lc.classList.toggle('busy',on&&!stuck);
  lc.setAttribute('aria-busy',(on&&!stuck)?'true':'false');
  if(on&&!stuck&&!listRetry)listRetry=setTimeout(pollList,350);
  return !stuck;
}
/* --- Marqueur « en lecture » ---------------------------------------------
   L'ampli ne fournit AUCUN moyen de savoir quelle ligne du menu est en train
   de jouer : Cursor_Position est un curseur de navigation (il ne suit ni la
   fin d'un morceau ni Skip Fwd/Skip Rev), les Attribute ne connaissent que
   Container/Item/Unselectable (pas de « Playing »), et GENA ne notifie pas la
   lecture réseau SERVER (mesuré, cf. docs/DLNA_PUSH.md §5 — seul le push DLNA
   est événementiel). On la retrouve donc côté client : les métadonnées de
   Play_Info sont comparées au texte des lignes visibles. Candidates dans
   l'ordre song → station → album → artist : à quelque niveau du menu qu'on se
   trouve (pistes, album, artiste, dossier), la ligne correspondant à la lecture
   en cours est marquée. Aucune correspondance (menu ailleurs, webradio sans
   métadonnées) → pas de marqueur, plutôt qu'un faux positif. */
let npKey=null, npPlaying=false;
function normTxt(s){return String(s==null?'':s).normalize('NFD')
  .replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();}
/* Appelé par render() AVANT syncListCard : paintList lit npKey. */
function noteNowPlaying(pi,isPlaying){
  const m=(pi&&pi.meta)||{};
  const cand=[m.song,m.station,m.album,m.artist].map(normTxt).filter(t=>t.length>1);
  npKey=cand.length?cand:null;      // null = rien à marquer (Stop, source muette…)
  npPlaying=!!isPlaying;
}
/* N° de la ligne en lecture (0 = aucune). Égalité stricte d'abord, puis
   préfixe — le firmware tronque Txt — seulement si le plus court des deux fait
   au moins 6 caractères (sinon « A » ou « 01 » matcherait n'importe quoi). */
function findNowLine(lines){
  if(!npKey||!lines||!lines.length)return 0;
  for(const k of npKey){
    for(const l of lines){
      const t=normTxt(l.txt);
      if(t.length<2)continue;
      if(t===k)return l.line;
      const a=t.length<k.length?t:k, b=t.length<k.length?k:t;
      if(a.length>=6&&b.startsWith(a))return l.line;
    }
  }
  return 0;
}
/* Peint un menu Ready ; renvoie false si ce n'est pas prêt (contenu laissé tel quel). */
function paintList(li){
  if(!(li&&li.menu_status==='Ready'&&li.lines&&li.lines.length))return false;
  listEver=true; listGaveUp=false;
  document.getElementById('menuname').textContent=li.menu_name||('niveau '+li.menu_layer);
  const menu=document.getElementById('menu'); menu.innerHTML='';
  const cur=parseInt(li.cursor_line||'0');
  const now=findNowLine(li.lines);
  li.lines.forEach(l=>{
    if(!l.txt&&l.attribute==='Unselectable')return;
    const d=document.createElement('div');
    const isNow=l.line===now;
    d.className='li'+(l.line===cur?' sel':'')+(isNow?' cur'+(npPlaying?'':' npidle'):'')
      +(l.attribute==='Unselectable'?' un':'');
    d.textContent=(l.line===cur?'▸ ':'')+l.txt;
    if(isNow)d.title=npPlaying?'En lecture':'Dernier morceau chargé';
    if(l.attribute!=='Unselectable')d.onclick=()=>nav('line',{n:l.line});
    menu.appendChild(d);
  });
  setListBusy(false);
  return true;
}
/* Clic dans le menu : grisé immédiat (avant même la réponse réseau).
   /api/line, /api/cursor et /api/page renvoient maintenant une réponse LÉGÈRE
   {ok, source, list} (1 PUT + 1 GET List_Info) au lieu du full_state() du
   wrapper (6-8 GET YNC, ~1 s) → le menu revient vite, et rien d'autre ne bouge
   dans la page pendant la navigation. La source est passée explicitement : le
   serveur n'a pas à relire Input_Sel. L'état complet (now playing…) est
   resynchronisé UNE fois, en différé, quand le menu s'est stabilisé.
   norefresh=true : la réponse ne porte plus de `state`, rien à render. */
function nav(action,body){
  listGaveUp=false;                        // un nouveau clic relance un cycle
  setListBusy(true);
  if(state.input&&!body.source)body.source=state.input;
  return api(action,body,true).then(function(j){
    if(j&&j.list&&paintList(j.list))queueFullRefresh();
    return j;
  });
}
/* Un seul full_state() par navigation (debounce), en arrière-plan : la réponse
   légère ne contient plus l'état complet, il faut bien recaler le « now playing »
   après avoir choisi une piste — mais pas à chaque clic ni à chaque relance. */
let fullRefreshTimer=null;
function queueFullRefresh(){clearTimeout(fullRefreshTimer);fullRefreshTimer=setTimeout(refresh,700);}
/* Relance légère pendant un chargement : /api/list ne fait qu'UN GET YNC.
   Chaîne .then (et pas async/await) : comportement identique dans le
   navigateur, mais testable sur l'horloge virtuelle du harnais. */
function pollList(){
  listRetry=null;
  if(!listBusySince)return;
  if(Date.now()-listBusySince>LIST_BUSY_MAX){listGaveUp=true;setListBusy(false);return;}   // abandon net
  const again=function(ms){listRetry=setTimeout(pollList,ms);};
  const done=function(j){ if(j&&paintList(j.list))queueFullRefresh(); else again(450); };
  try{
    fetch('/api/list',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({source:state.input})})
      .then(function(r){return r.json();})
      .then(done,function(){again(700);});
  }catch(_){again(700);}
}

/* Visibilité/état de la carte : extraite de render() pour être testable telle
   quelle. La carte ne se masque que si on quitte la liste (source, push, veille)
   ou si le chargement a dépassé LIST_BUSY_MAX — jamais entre deux niveaux. */
function syncListCard(s,on,inp){
  const lc=document.getElementById('listcard');
  const listSrc=['SERVER','NET RADIO'].includes((inp||'').toUpperCase());
  if(on&&!pushMode&&listSrc){
    const ready=paintList(s.list_info);    // d'abord : un menu Ready l'emporte toujours
    if(ready||(listEver&&!listGaveUp&&setListBusy(true)))lc.style.display='';
    else { lc.style.display='none'; listEver=false; setListBusy(false); }
  }else{
    lc.style.display='none';
    listEver=false; listGaveUp=false; setListBusy(false);
  }
}

function render(s,ts){
  // un état partiel (amorçage) ne doit jamais écraser un état complet déjà reçu
  if(s.partial&&state&&!state.partial&&state.power)return;
  state=s;
  // volume/mute passent par noteDevice (ts) : un snapshot plus vieux qu'un
  // écho SSE déjà reçu est ignoré → plus d'écrasement anti-flicker à la genaVol.
  noteDevice(s.volume,s.mute,ts);
  paintVolLabel();                       // power vient d'arriver : le libellé suit
  const on=s.power==='On';
  document.getElementById('sysinfo').textContent=`${s.model||'R-N301'}${s.version?' · v'+s.version:''} · ${on?'allumé':'veille'}${genaLive?' · GENA':''}`;
  const bp=document.getElementById('btnPower'); bp.classList.toggle('on',on);

  // amorçage : on s'arrête aux sources (les cartes riches sont display:none)
  if(s.partial){renderSources(s);return;}

  // sources (+ pseudo-source PUSH en dernier)
  const ps=s.push_state||{};
  if(['PLAYING','TRANSITIONING','PAUSED_PLAYBACK'].includes(ps.state)) pushMode=true;
  if(s.input!=='SERVER') pushMode=false;
  renderSources(s);

  // now playing (sources réseau)
  const inp=(s.input||'').toUpperCase();
  const net=['NET RADIO','SERVER','SPOTIFY','AIRPLAY'].includes(inp);
  const pi=s.play_info||{};
  const nc=document.getElementById('nowcard');
  if(on&&net&&pi.available!=='Not Ready'&&(pi.meta||pi.playback)){
    nc.style.display='';
    playing=pushMode?['PLAYING','TRANSITIONING'].includes(ps.state):(pi.playback||'')==='Play';
    noteNowPlaying(pi,playing);        // avant syncListCard : paintList marque la ligne en lecture
    /* play_arrow / pause sont tous les deux en version pleine (.fill, voir HTML). */
    document.getElementById('playIcon').textContent=playing?'pause':'play_arrow';
    /* Lecture SERVER (DLNA) : le firmware n'honore PAS le Pause — mesuré en live,
       PUT <SERVER><Play_Control><Playback>Pause</Playback> renvoie RC="0" mais
       Playback_Info reste 'Play' et Play_Time continue de tourner (le Stop, lui,
       est honoré ; et Play après Stop ne reprend pas : la file est vidée).
       L'app Yamaha officielle échoue pareil, même op YNC. On grise donc le bouton
       au lieu de laisser un contrôle qui ne fait rien.
       NET RADIO / Spotify / AirPlay : NON testés → on ne change rien pour eux. */
    const noPause=!pushMode&&inp==='SERVER';
    const bplay=document.getElementById('btnPlay');
    bplay.disabled=noPause;
    const tip=noPause?'Pause non supporté par le firmware en lecture serveur (DLNA) — utiliser Stop':'Lecture / Pause';
    bplay.title=tip; bplay.setAttribute('aria-label',tip);
    const m=pi.meta||{};
    document.getElementById('npTitle').textContent=m.song||m.station||'—';
    document.getElementById('npSub').textContent=[m.artist,m.album].filter(Boolean).join(' · ');
    document.getElementById('playstate').textContent=pi.playback||'';
    /* Pochette : en push, l'ampli ne relaie PAS la couverture intégrée du fichier
       (Album_ART/URL reste son propre /YamahaRemoteControl/AlbumART/AlbumART.ymf) →
       on sert directement celle extraite du fichier par la lib (/pushart, déjà
       présent côté serveur). push_meta.cover vient de last_meta (booléen).
       Clé de cache = titre/artiste/album : l'URI DLNA poussée est toujours
       /audio/1/, elle ne changerait pas d'un fichier à l'autre. */
    const pm=s.push_meta||{};
    setArt(document.getElementById('art'),
      pushMode&&pm.cover?'/pushart?v='+encodeURIComponent([pm.title,pm.artist,pm.album].join('|'))
                        :pi.album_art?'/art?url='+encodeURIComponent(pi.album_art):'');
    if(pi.shuffle!==undefined){shuffle=pi.shuffle==='On';document.getElementById('btnShuffle').classList.toggle('on',shuffle);}
    if(pi.repeat!==undefined){repeat=pi.repeat;document.getElementById('btnRepeat').classList.toggle('on',repeat!=='Off');document.getElementById('repeatIcon').textContent=repeat==='One'?'repeat_one':'repeat';}
  } else { nc.style.display='none'; noteNowPlaying(null,false); }

  // en mode push : transport simplifié (ni prev/next, ni shuffle/repeat — sans objet)
  ['btnPrev','btnNext','btnShuffle','btnRepeat'].forEach(id=>{
    const e=document.getElementById(id); if(e) e.style.display=pushMode?'none':'';
  });

  // tuner
  const tc=document.getElementById('tunercard');
  if(on&&inp==='TUNER'){
    tc.style.display='';
    const f=pi.freq, u=pi.freq_unit;
    document.getElementById('tunerinfo').textContent=
      `${pi.band||'?'} ${f?(u==='MHz'?(f/100).toFixed(2)+' MHz':f+' kHz'):''} ${pi.tuned==='Positive'?'· accordé':''} ${pi.stereo==='Positive'?'· stéréo':''}`;
    band=pi.band||'FM'; document.getElementById('bandsel').value=band;
    if(f!=null)document.getElementById('freq').value=band==='FM'?(f/100).toFixed(2):f;
    const ps2=document.getElementById('presets');
    if(!ps2.children.length){for(let n=1;n<=8;n++){const b=document.createElement('button');b.textContent=n;b.onclick=()=>api('tuner',{op:'preset',n});ps2.appendChild(b);}}
  } else tc.style.display='none';

  // navigateur liste SERVER / NET RADIO (règle dans syncListCard)
  syncListCard(s,on,inp);

  // push (carte visible seulement en mode push)
  document.getElementById('pushcard').style.display=(on&&pushMode)?'':'none';
  document.getElementById('pushstate').textContent=ps.state||'—';

  // système
  document.getElementById('btnNetStdby').classList.toggle('on',s.net_standby==='On');
  if(s.net_name)document.getElementById('netname').textContent=s.net_name;

  armNow();       // lecture en cours : (ré)arme le sondage léger si utile
}

/* ===== Lecture en cours : sondage léger (/api/now) ==========================
   2 GET YNC (Play_Info + List_Info) au lieu des 6-8 de /api/state. Deux usages :
     - en continu (2,5 s) pendant qu'une source à liste joue : la carte Lecture
       et le marqueur « en lecture » du navigateur suivent une fin de morceau
       sans attendre le poll complet de 4 s ;
     - en relance ciblée après une action de transport (bumpNow).
   GENA ne peut pas remplacer ça : l'AVTransport du renderer ne notifie que le
   push DLNA, jamais la lecture réseau SERVER (mesuré — docs/DLNA_PUSH.md §5).
   Le bus YNC est sérialisé côté lib : ce sondage ne tourne que si l'onglet est
   visible, qu'aucune navigation n'est en cours et que la source joue vraiment. */
const NOW_MS=2500;
let nowTimer=null, nowInFlight=false, bumpTimers=[];
function nowWanted(){
  if(document.hidden||pushMode||state.power!=='On')return false;
  const inp=(state.input||'').toUpperCase();
  if(inp!=='SERVER'&&inp!=='NET RADIO')return false;
  const pi=state.play_info||{};
  return pi.available!=='Not Ready'&&(pi.playback||'')!=='Stop';
}
function armNow(){if(!nowTimer&&!nowInFlight&&nowWanted())nowTimer=setTimeout(pollNow,NOW_MS);}
/* Fusion dans l'état courant puis rendu : le même chemin que le poll complet,
   donc les mêmes règles (carte qui ne disparaît pas, curseur grisé…). */
function applyNow(j){
  if(!j||j.error)return;
  if(j.play_info!==undefined)state.play_info=j.play_info;
  if(j.list_info!==undefined)state.list_info=j.list_info;
  render(state);
}
/* force=true : relance après un clic de transport — l'état local peut encore
   dire « Stop » alors que la lecture vient de (re)partir. */
function pollNow(force){
  nowTimer=null;
  if(nowInFlight)return;
  if(!force&&!nowWanted())return;
  if(!state.input)return;
  nowInFlight=true;
  fetch('/api/now?source='+encodeURIComponent(state.input))
    .then(function(r){return r.json();})
    .then(function(j){nowInFlight=false;applyNow(j);armNow();},
          function(){nowInFlight=false;armNow();});
}
function bumpNow(){
  bumpTimers.forEach(clearTimeout);
  bumpTimers=[700,2200].map(function(ms){return setTimeout(function(){pollNow(true);},ms);});
}
document.addEventListener('visibilitychange',function(){
  if(document.hidden){clearTimeout(nowTimer);nowTimer=null;}
  else{refresh();armNow();}           // retour d'onglet : état frais tout de suite
});

bootstrap(); refresh(); setInterval(refresh,4000);

// volume/mute en push instantané (GENA → SSE) — canal ordonné, ts = réception
let genaLive=false;                 // sert uniquement au badge « GENA » de sysinfo
const es=new EventSource('/api/events');
es.onopen=()=>{genaLive=true;};
es.onerror=()=>{genaLive=false;};   // EventSource se reconnecte seul
es.onmessage=e=>{
  try{
    const d=JSON.parse(e.data);
    genaLive=true;
    noteDevice(d.volume,d.mute);
  }catch(_){}
};

/* -- Thème : auto → light → dark (mécanisme + persistance repris du pack) -- */
(function(){
  const MODES=['auto','light','dark'];
  const root=document.documentElement;
  let mode=(function(){try{const m=localStorage.getItem('theme');return MODES.indexOf(m)!==-1?m:'auto';}catch(e){return 'auto';}})();
  function apply(){
    root.classList.add('theming');                 // coupe les transitions 1 frame
    if(mode==='light')root.setAttribute('data-theme','light');
    else if(mode==='dark')root.setAttribute('data-theme','dark');
    else root.removeAttribute('data-theme');
    void root.offsetWidth;                          // force le style avant de les rendre
    requestAnimationFrame(function(){root.classList.remove('theming');});
    try{localStorage.setItem('theme',mode);}catch(e){}
  }
  function sync(){const b=document.querySelector('[data-theme-toggle]');if(!b)return;
    b.setAttribute('data-mode',mode);const l='Thème : '+mode;b.setAttribute('aria-label',l);b.title=l;}
  const btn=document.querySelector('[data-theme-toggle]');
  if(btn)btn.addEventListener('click',()=>{mode=MODES[(MODES.indexOf(mode)+1)%MODES.length];apply();sync();});
  apply();sync();
})();
</script>
